name: Feature request
description: 提议改进或新能力
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 这个功能要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy constraints
      options:
        - label: 方案不要求读取 Cookie、Token、私有数据库或调用 OpenAI API
          required: true
